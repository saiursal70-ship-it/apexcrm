<svg viewBox="0 0 240 215" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="apexTealLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0f4c64" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
    <linearGradient id="apexTealHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="apexBronzeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="apexBronzeHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="apexStarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="apexTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="apexGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <g className="apex-emblem-group">
    <g className="peak-left">
      <polygon points="68,75 18,155 68,155" fill="url(#apexTealLeft)" opacity="0.9" />
      <polygon points="68,75 68,155 92,155" fill="url(#apexBronzeRight)" opacity="0.75" />
    </g>
    <g className="peak-right">
      <polygon points="172,75 148,155 172,155" fill="url(#apexTealLeft)" opacity="0.75" />
      <polygon points="172,75 172,155 222,155" fill="url(#apexBronzeRight)" opacity="0.9" />
    </g>
    <g className="peak-center" filter="url(#apexGlow)">
      <polygon points="120,25 22,160 120,160" fill="url(#apexTealLeft)" />
      <polygon points="120,25 120,160 218,160" fill="url(#apexBronzeRight)" />
      <line x1="120" y1="25" x2="120" y2="160" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6" />
    </g>
    <path d="M 120,10 L 122.5,18 L 130,18 L 124,22.5 L 126,30 L 120,25.5 L 114,30 L 116,22.5 L 110,18 L 117.5,18 Z" fill="url(#apexStarGold)" stroke="#b45309" stroke-width="0.5" />
    <g className="center-symbol" transform="translate(0, 5)">
      <path d="M 120,68 L 164,108 L 120,148 L 76,108 Z" fill="none" stroke="url(#apexBronzeHighlight)" stroke-width="5.5" stroke-linejoin="bevel" />
      <path d="M 102,94 L 88,108 L 102,122" fill="none" stroke="url(#apexBronzeHighlight)" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel" />
      <path d="M 138,94 L 152,108 L 138,122" fill="none" stroke="url(#apexBronzeHighlight)" stroke-width="6" stroke-linecap="square" stroke-linejoin="bevel" />
      <g className="upward-arrow">
        <path d="M 86,145 L 130,85" stroke="url(#apexTealHighlight)" stroke-width="7" stroke-linecap="square" />
        <path d="M 118,80 L 136,83 L 133,101 Z" fill="url(#apexTealHighlight)" />
      </g>
    </g>
  </g>

  <g className="apex-text-group" transform="translate(120, 198)">
    <text text-anchor="middle" fill="url(#apexTextGrad)" font-size="24" font-weight="800" font-family="'Poppins', 'Inter', sans-serif" letter-spacing="3.5">
      APEX DEV
    </text>
  </g>
</svg>
